services: tailscale: image: tailscale/tailscale:latest container_name: ts-iscsi-target hostname: iscsi-target environment: - TS_AUTHKEY=tskey-auth-YOUR_TAGGED_AUTH_KEY - TS_STATE_DIR=/var/lib/tailscale - TS_USERSPACE=true volumes: - ts-state:/var/lib/tailscale - /dev/net/tun:/dev/net/tun cap_add: - NET_ADMIN restart: unless-stopped tgt-iscsi: image: ubuntu:24.04 container_name: tgt-iscsi-server network_mode: service:tailscale environment: - STORAGE_SIZE=500G volumes: - target-data:/storage command: > /bin/sh -c " apt-get update && apt-get install -y tgt && truncate -s $${STORAGE_SIZE} /storage/target_disk.img && tgtd -f & sleep 2 && tgtadm --lld iscsi --mode target --op new --tid 1 --targetname iqn.2026-11.com.storage:target1 && tgtadm --lld iscsi --mode logicalunit --op new --tid 1 --lun 1 --backing-store /storage/target_disk.img && tgtadm --lld iscsi --mode target --op bind --tid 1 --initiator-address ALL && tail -f /dev/null " restart: unless-stopped volumes: ts-state: target-data:
