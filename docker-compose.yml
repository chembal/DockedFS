# DockedFS host stack. Configure everything in .env (copy .env.example).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: dockedfs-tailscale
    hostname: ${TS_HOSTNAME:-dockedfs}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      # Userspace networking: no /dev/net/tun and no routes on the host, so the
      # client's tailnet can only ever reach this container, never your LAN.
      - TS_USERSPACE=true
      - TS_ACCEPT_DNS=false
      # Don't upload this node's logs to Tailscale.
      - TS_TAILSCALED_EXTRA_ARGS=--no-logs-no-support
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped

  target:
    build: ./target
    image: dockedfs-target:local
    container_name: dockedfs-target
    network_mode: service:tailscale
    depends_on: [tailscale]
    # Least privilege: the entrypoint (root) only sets up the firewall, the
    # bandwidth cap and the disk image, then runs the iSCSI server as "tgt".
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN        # firewall and bandwidth cap
      - SETUID           # drop to the tgt user
      - SETGID
      - CHOWN            # give the disk image to tgt
      - DAC_OVERRIDE     # create/grow the image in DATA_DIR
      - FOWNER
      - NET_BIND_SERVICE # port 3260, kept by tgt only
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      - STORAGE_SIZE=${STORAGE_SIZE:?set STORAGE_SIZE in .env}
      - PREALLOCATE=${PREALLOCATE:-false}
      - MAX_BANDWIDTH_MBIT=${MAX_BANDWIDTH_MBIT:-}
      - TS_AUTHKEY=${TS_AUTHKEY} # used only to derive the CHAP login
      - CHAP_DISABLE=${CHAP_DISABLE:-false}
      - CHAP_USER=${CHAP_USER:-}
      - CHAP_PASSWORD=${CHAP_PASSWORD:-}
      - FIREWALL=${FIREWALL:-true}
    volumes:
      - ${DATA_DIR:-./data}:/storage
    restart: unless-stopped

volumes:
  ts-state:
