# Target only, published on localhost instead of a tailnet. Used by smoke.sh.
name: dockedfs-test
services:
  target:
    build:
      context: ../target
      network: host # use the machine's own DNS; CI's bridge DNS is flaky
      args:
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-}
    image: dockedfs-target:local
    container_name: dockedfs-test-target
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      - DOCKEDFS_TEST_PUBLISH=true # let the published test port through the firewall
      - STORAGE_SIZE=${STORAGE_SIZE:-1G}
      - PREALLOCATE=false
      - MAX_BANDWIDTH_MBIT=${MAX_BANDWIDTH_MBIT:-}
      - TS_AUTHKEY=${TEST_AUTHKEY:-}
      - CHAP_DISABLE=${TEST_CHAP_DISABLE:-false}
      - CHAP_USER=${TEST_CHAP_USER-tester}
      - CHAP_PASSWORD=${TEST_CHAP_PASSWORD-smoke-test-123}
    volumes:
      - ${TEST_DATA_DIR:?}:/storage
    ports:
      - "127.0.0.1:${TEST_PORT:-13260}:3260"
